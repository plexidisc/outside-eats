<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outside Eats CRM</title>
<!-- Pinned to a specific version on purpose. An unpinned "@2" tag pulls
     whatever is newest, which caused auth calls to hang forever on the
     main Outside Eats site. Update this version deliberately, don't just
     drop the pin. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --navy: #011f49;
    --border: #d8dde3;
    --bg: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Source Sans 3", -apple-system, sans-serif;
    background: var(--bg);
    margin: 0;
    color: #1a1a1a;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 14px 20px;
    font-family: "DM Sans", sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header button {
    background: transparent;
    border: 1px solid white;
    color: white;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
  }
  #login-view {
    max-width: 360px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  #login-view h2 { margin-top: 0; }
  #login-view input {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
  }
  #login-view button {
    width: 100%;
    padding: 10px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #login-error {
    color: #b3261e;
    font-size: 13px;
    min-height: 18px;
  }
  main {
    max-width: 1000px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .toolbar input {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .toolbar button {
    padding: 8px 14px;
    border: 1px solid var(--navy);
    background: white;
    color: var(--navy);
    border-radius: 4px;
    cursor: pointer;
  }
  .toolbar button.primary {
    background: var(--navy);
    color: white;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 6px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th {
    background: #eef0f3;
    font-weight: 600;
  }
  tr.contact-row { cursor: pointer; }
  tr.contact-row:hover { background: #f0f4fa; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    border: 1px solid var(--border);
  }
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: white;
    width: 560px;
    max-width: 92vw;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 8px;
    padding: 24px;
  }
  #modal-box h2 { margin-top: 0; }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  .field-grid label {
    font-size: 12px;
    color: #555;
    display: block;
    margin-bottom: 3px;
  }
  .field-grid input, .field-grid select {
    width: 100%;
    padding: 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
  }
  #notes-history {
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 13px;
    margin-top: 6px;
  }
  #notes-history .note-entry { margin-bottom: 10px; }
  #notes-history .note-timestamp { color: #777; font-size: 11px; }
  #new-note-text {
    width: 100%;
    padding: 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 14px;
    resize: vertical;
    min-height: 50px;
  }
  .modal-actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #delete-btn {
    margin-right: auto;
    background: white;
    border: 1px solid #b3261e;
    color: #b3261e;
  }
  #cancel-btn {
    background: white;
    border: 1px solid var(--border);
  }
  #save-btn {
    background: var(--navy);
    border: 1px solid var(--navy);
    color: white;
  }
  #status-msg {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <span>Outside Eats CRM</span>
  <button id="logout-btn" style="display:none">Log out</button>
</header>

<div id="login-view">
  <h2>Log in</h2>
  <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
  <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
  <button id="login-btn">Log in</button>
  <div id="login-error"></div>
</div>

<main id="app-view" style="display:none">
  <div class="toolbar">
    <input type="text" id="search-box" placeholder="Search restaurant or city" />
    <button class="primary" id="add-btn">Add new</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Restaurant</th>
        <th>City</th>
        <th>Status</th>
        <th>Next follow up</th>
        <th>Priority</th>
      </tr>
    </thead>
    <tbody id="contacts-tbody"></tbody>
  </table>
</main>

<div id="modal-overlay">
  <div id="modal-box">
    <h2 id="modal-title">New contact</h2>
    <div class="field-grid">
      <div><label>Restaurant name</label><input id="f-restaurant_name" /></div>
      <div><label>Owner / contact name</label><input id="f-contact_name" /></div>
      <div><label>Phone</label><input id="f-phone" /></div>
      <div><label>Email</label><input id="f-email" /></div>
      <div><label>Address</label><input id="f-address" /></div>
      <div><label>City</label><input id="f-city" /></div>
      <div>
        <label>Status</label>
        <select id="f-status">
          <option>Not contacted</option>
          <option>Contacted</option>
          <option>Follow up scheduled</option>
          <option>Pitched</option>
          <option>Declined</option>
          <option>Signed</option>
        </select>
      </div>
      <div>
        <label>Priority</label>
        <select id="f-priority">
          <option>High</option>
          <option selected>Medium</option>
          <option>Low</option>
        </select>
      </div>
      <div><label>Next follow up date</label><input type="date" id="f-next_followup_date" /></div>
      <div><label>Source</label><input id="f-source" /></div>
      <div><label>Listing slug</label><input id="f-listing_slug" /></div>
    </div>

    <label style="font-size:13px;font-weight:600;display:block;margin-top:16px">Notes history</label>
    <div id="notes-history"></div>

    <label style="font-size:13px;font-weight:600;display:block;margin-top:12px">Add a note</label>
    <textarea id="new-note-text" placeholder="What happened, what's next"></textarea>

    <div id="status-msg"></div>

    <div class="modal-actions">
      <button id="delete-btn" style="display:none">Delete</button>
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn">Save</button>
    </div>
  </div>
</div>

<script>
  // ---- Fill these in with your Supabase project's values ----
  // Dashboard > Project Settings > API
  const SUPABASE_URL = "https://sxaflcurpqyfhapnvaoh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4YWZsY3VycHF5ZmhhcG52YW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDMzMDgsImV4cCI6MjA5NTQ3OTMwOH0.IrN4-YNpAqzd5xXKq9IAcQZCCJ7RkKrtuXB5AUDVq-g";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
    // Deliberately no "storage: window.localStorage" override here.
    // That option has previously crashed the whole auth script block
    // with a SecurityError on this stack. Leave the default.
  });

  // Wraps any Supabase call with a timeout so a slow or hung network
  // request can't freeze the UI forever. Matches the fix already
  // confirmed working on the main Outside Eats site.
  function withTimeout(promise, ms = 8000, label = "request") {
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error(`${label} timed out`)), ms)
      )
    ]);
  }

  let currentContactId = null;
  let allContacts = [];
  let currentAccessToken = null;

  // Detects PostgREST's clock-skew rejection: a 401 PGRST303
  // "JWT issued at future" (or a related JWT error) that fires when the
  // presented access token's timestamp looks wrong to the server. Almost
  // always a stale/cached token or a device clock set ahead of real time.
  function isClockSkewError(status, body) {
    return status === 401 && /PGRST303|issued at future|JWT/i.test(body || "");
  }

  // Force-mints a fresh access token from the stored refresh token. This
  // bypasses the SDK's own expiry math (which trusts the local clock and
  // can be fooled by a wrong device time) and re-stamps the token with the
  // server's real "issued at", which is what self-heals a rejected token.
  // Returns true if a new token was obtained.
  async function forceRefreshSession() {
    try {
      const { data, error } = await withTimeout(
        supabaseClient.auth.refreshSession(),
        8000,
        "Session refresh"
      );
      if (error || !data || !data.session) return false;
      currentAccessToken = data.session.access_token;
      return true;
    } catch (e) {
      return false;
    }
  }

  // Direct REST calls instead of the SDK's .from() data client. Auth
  // calls through the SDK work fine on this stack, but SDK data calls
  // have hung specifically on the live site before (confirmed on the
  // main Outside Eats site). This bypasses that entirely.
  async function restRequest(path, options = {}, _retried = false) {
    const url = `${SUPABASE_URL}/rest/v1/${path}`;
    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${currentAccessToken}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    };
    const response = await withTimeout(
      fetch(url, { ...options, headers }),
      8000,
      options.label || "Request"
    );
    if (!response.ok) {
      const text = await response.text();
      // A stale or future-dated token surfaces as a 401 (often PGRST303
      // "JWT issued at future"). Force one token refresh and retry before
      // giving up — this transparently recovers a cached bad token.
      if (!_retried && response.status === 401) {
        const refreshed = await forceRefreshSession();
        if (refreshed) {
          return restRequest(path, options, true);
        }
        if (isClockSkewError(response.status, text)) {
          throw new Error("CLOCK_SKEW");
        }
      }
      throw new Error(`${response.status}: ${text}`);
    }
    if (response.status === 204) return null;
    const text = await response.text();
    return text ? JSON.parse(text) : null;
  }

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const logoutBtn = document.getElementById("logout-btn");

  function showApp() {
    loginView.style.display = "none";
    appView.style.display = "block";
    logoutBtn.style.display = "inline-block";
    loadContacts();
  }

  function showLogin() {
    loginView.style.display = "block";
    appView.style.display = "none";
    logoutBtn.style.display = "none";
  }

  // React to auth state rather than blocking startup on an awaited
  // getSession call, which is the pattern that has hung on this stack
  // before.
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session) {
      currentAccessToken = session.access_token;
      showApp();
    } else {
      currentAccessToken = null;
      showLogin();
    }
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorBox = document.getElementById("login-error");
    errorBox.textContent = "";

    if (!email || !password) {
      errorBox.textContent = "Enter both email and password.";
      return;
    }

    try {
      const { error } = await withTimeout(
        supabaseClient.auth.signInWithPassword({ email, password }),
        8000,
        "Login"
      );
      if (error) {
        errorBox.textContent = error.message;
      }
      // On success, onAuthStateChange fires and shows the app.
    } catch (err) {
      errorBox.textContent = "Login failed or timed out. Check your connection and try again.";
    }
  });

  logoutBtn.addEventListener("click", () => {
    // Fire and forget: don't await signOut, since that call has hung
    // before on this stack. Clear local UI state immediately either way.
    supabaseClient.auth.signOut().catch(() => {});
    showLogin();
  });

  async function loadContacts() {
    try {
      const data = await restRequest(
        "crm_contacts?select=*&order=restaurant_name.asc",
        { label: "Loading contacts" }
      );
      allContacts = data || [];
      renderContacts();
    } catch (err) {
      const msg = err.message === "CLOCK_SKEW"
        ? "Your session was rejected as out of date. This usually means your device's clock is set wrong — turn on automatic date &amp; time, then sign out and sign in again."
        : `Could not load contacts: ${err.message}`;
      document.getElementById("contacts-tbody").innerHTML =
        `<tr><td colspan="5">${msg}</td></tr>`;
    }
  }

  function renderContacts() {
    const query = document.getElementById("search-box").value.trim().toLowerCase();
    const tbody = document.getElementById("contacts-tbody");
    tbody.innerHTML = "";

    const filtered = allContacts.filter((c) => {
      if (!query) return true;
      return (
        (c.restaurant_name || "").toLowerCase().includes(query) ||
        (c.city || "").toLowerCase().includes(query)
      );
    });

    for (const c of filtered) {
      const tr = document.createElement("tr");
      tr.className = "contact-row";
      tr.innerHTML = `
        <td>${escapeHtml(c.restaurant_name || "")}</td>
        <td>${escapeHtml(c.city || "")}</td>
        <td><span class="badge">${escapeHtml(c.status || "")}</span></td>
        <td>${escapeHtml(c.next_followup_date || "")}</td>
        <td>${escapeHtml(c.priority || "")}</td>
      `;
      tr.addEventListener("click", () => openModal(c.id));
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("search-box").addEventListener("input", renderContacts);
  document.getElementById("add-btn").addEventListener("click", () => openModal(null));

  const FORM_FIELDS = [
    "restaurant_name", "contact_name", "phone", "email", "address",
    "city", "status", "priority", "next_followup_date", "source", "listing_slug"
  ];

  async function openModal(contactId) {
    currentContactId = contactId;
    document.getElementById("status-msg").textContent = "";
    document.getElementById("new-note-text").value = "";
    document.getElementById("modal-title").textContent =
      contactId ? "Edit contact" : "New contact";
    document.getElementById("delete-btn").style.display = contactId ? "inline-block" : "none";

    for (const key of FORM_FIELDS) {
      document.getElementById(`f-${key}`).value = "";
    }
    document.getElementById("f-status").value = "Not contacted";
    document.getElementById("f-priority").value = "Medium";
    document.getElementById("notes-history").innerHTML = "";

    if (contactId) {
      const contact = allContacts.find((c) => c.id === contactId);
      if (contact) {
        for (const key of FORM_FIELDS) {
          document.getElementById(`f-${key}`).value = contact[key] || "";
        }
      }
      await loadNotes(contactId);
    }

    document.getElementById("modal-overlay").classList.add("open");
  }

  async function loadNotes(contactId) {
    const notesBox = document.getElementById("notes-history");
    try {
      const data = await restRequest(
        `crm_notes?select=*&contact_id=eq.${contactId}&order=created_at.desc`,
        { label: "Loading notes" }
      );
      notesBox.innerHTML = (data || [])
        .map(
          (n) => `
          <div class="note-entry">
            <div class="note-timestamp">${new Date(n.created_at).toLocaleString()}</div>
            <div>${escapeHtml(n.note_text)}</div>
          </div>`
        )
        .join("");
    } catch (err) {
      notesBox.textContent = `Could not load notes: ${err.message}`;
    }
  }

  document.getElementById("cancel-btn").addEventListener("click", closeModal);

  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    const statusMsg = document.getElementById("status-msg");
    const restaurantName = document.getElementById("f-restaurant_name").value.trim();
    if (!restaurantName) {
      statusMsg.textContent = "Restaurant name is required.";
      statusMsg.style.color = "#b3261e";
      return;
    }

    const values = {};
    for (const key of FORM_FIELDS) {
      values[key] = document.getElementById(`f-${key}`).value.trim() || null;
    }

    statusMsg.style.color = "#777";
    statusMsg.textContent = "Saving...";

    try {
      let contactId = currentContactId;

      if (contactId) {
        await restRequest(`crm_contacts?id=eq.${contactId}`, {
          method: "PATCH",
          body: JSON.stringify(values),
          label: "Saving contact"
        });
      } else {
        const data = await restRequest("crm_contacts", {
          method: "POST",
          body: JSON.stringify(values),
          headers: { Prefer: "return=representation" },
          label: "Saving contact"
        });
        contactId = data[0].id;
      }

      const newNoteText = document.getElementById("new-note-text").value.trim();
      if (newNoteText) {
        await restRequest("crm_notes", {
          method: "POST",
          body: JSON.stringify({ contact_id: contactId, note_text: newNoteText }),
          headers: { Prefer: "return=representation" },
          label: "Saving note"
        });
      }

      statusMsg.textContent = "Saved.";
      await loadContacts();
      closeModal();
    } catch (err) {
      statusMsg.style.color = "#b3261e";
      statusMsg.textContent = `Save failed: ${err.message}`;
    }
  });

  document.getElementById("delete-btn").addEventListener("click", async () => {
    if (!currentContactId) return;
    if (!confirm("Delete this contact and its notes? This cannot be undone.")) return;

    try {
      await restRequest(`crm_contacts?id=eq.${currentContactId}`, {
        method: "DELETE",
        label: "Deleting contact"
      });
      await loadContacts();
      closeModal();
    } catch (err) {
      document.getElementById("status-msg").style.color = "#b3261e";
      document.getElementById("status-msg").textContent = `Delete failed: ${err.message}`;
    }
  });
</script>

</body>
</html>
